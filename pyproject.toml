[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratusscan-azure"
version = "0.1.0-alpha"
description = "Azure resource inventory exporter — read-only, Cloud Shell-friendly, multi-subscription"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0"}

authors = [
    {name = "StratusScan Contributors"}
]

keywords = [
    "azure",
    "security",
    "audit",
    "cloud",
    "scanner",
    "compliance",
    "export",
    "inventory",
    "resource-graph",
    "entra-id",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    "azure-identity>=1.15.0",
    # Pinned <25: v25.0.0 removed the .policy submodule (PolicyClient).
    # Lift this when an official replacement package ships on PyPI.
    "azure-mgmt-resource>=23.0.0,<25",
    "azure-mgmt-subscription>=3.1.1",
    "azure-mgmt-resourcegraph>=8.0.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-policyinsights>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
stratusscan-azure = "stratusscan_azure:main"
stratusscan-azure-configure = "configure:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
