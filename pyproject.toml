[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratusscan-cli-azure"
version = "0.1.0"
description = "Azure resource inventory and export tool for infrastructure audits and FedRAMP evidence collection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}

authors = [
    {name = "StratusScan Contributors"}
]

keywords = [
    "azure",
    "security",
    "audit",
    "cloud",
    "scanner",
    "compliance",
    "export",
    "inventory",
    "fedramp",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    "azure-identity>=1.15.0,<2.0.0",
    # 25.x splits policy/locks into azure-mgmt-resource-policy/-locks, both still beta
    "azure-mgmt-resource>=23.0.0,<25.0.0",
    "azure-mgmt-compute>=38.0.0,<39.0.0",
    "azure-mgmt-network>=32.0.0,<33.0.0",
    "azure-mgmt-storage>=25.0.0,<26.0.0",
    "azure-mgmt-keyvault>=14.0.0,<15.0.0",
    "azure-mgmt-authorization>=4.0.0,<5.0.0",
    "azure-mgmt-containerservice>=41.0.0,<42.0.0",
    "azure-mgmt-web>=11.0.0,<12.0.0",
    "azure-mgmt-sql>=4.0.0,<5.0.0",
    "azure-mgmt-cosmosdb>=10.0.0,<11.0.0",
    "azure-mgmt-managementgroups>=2.0.0,<3.0.0",
    "azure-mgmt-security>=7.0.0,<8.0.0",
    "azure-mgmt-advisor>=9.0.0,<10.0.0",
    # 7.x and 8.0.0b3 ship no diagnostic_settings operation group and no other package carries it
    "azure-mgmt-monitor>=6.0.0,<7.0.0",
    "azure-mgmt-loganalytics>=14.0.0,<15.0.0",
    "azure-mgmt-costmanagement>=5.0.0,<6.0.0",
    "azure-mgmt-postgresqlflexibleservers>=2.0.0,<3.0.0",
    "azure-mgmt-mysqlflexibleservers>=1.0.0,<2.0.0",
    "azure-mgmt-redis>=14.5.0,<15.0.0",
    "azure-mgmt-containerregistry>=15.0.0,<16.0.0",
    "azure-mgmt-appcontainers>=5.0.0,<6.0.0",
    "azure-mgmt-containerinstance>=10.1.0,<11.0.0",
    "azure-mgmt-dns>=9.0.0,<10.0.0",
    "azure-mgmt-privatedns>=2.0.0,<3.0.0",
    "azure-mgmt-cdn>=14.0.0,<15.0.0",
    "azure-mgmt-trafficmanager>=1.1.0,<2.0.0",
    "azure-mgmt-eventhub>=12.0.0,<13.0.0",
    "azure-mgmt-servicebus>=10.0.0,<11.0.0",
    "azure-mgmt-apimanagement>=5.0.0,<6.0.0",
    "azure-mgmt-logic>=10.0.0,<11.0.0",
    "azure-mgmt-msi>=7.1.0,<8.0.0",
    "azure-mgmt-policyinsights>=1.0.1,<2.0.0",
    "azure-mgmt-automation>=2.0.0,<3.0.0",
    "azure-mgmt-batch>=19.0.0,<20.0.0",
    "azure-mgmt-recoveryservices>=4.0.1,<5.0.0",
    "azure-mgmt-applicationinsights>=4.1.0,<5.0.0",
    "azure-keyvault-keys>=4.8.0,<5.0.0",
    "azure-keyvault-secrets>=4.7.0,<5.0.0",
    "azure-keyvault-certificates>=4.7.0,<5.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Repository = "https://github.com/ColonelPanicX/StratusScan-CLI-Azure"

# Clone-and-run only (v0.1.x): py-modules exists so `pip install -e ".[dev]"` works in CI.
[tool.setuptools]
py-modules = ["stratusscan", "configure", "utils", "runner", "bootstrap"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = [
    "E501",
    "B008",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

# Coverage is opt-in (`--cov=.`), so a local run needs neither pytest-cov nor writes htmlcov/.
addopts = [
    "--strict-markers",
    "-m", "not azure",
]

markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "azure: marks tests that interact with Azure (requires credentials)",
]

[tool.coverage.run]
source = ["."]
omit = ["*/tests/*", "*/test_*.py", "*/.venv/*", "*/venv/*"]

[tool.coverage.html]
directory = "htmlcov"
